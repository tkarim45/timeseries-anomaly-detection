[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timeseries-anomaly-detection"
version = "0.1.0"
description = "Labeled synthetic time series + a bench of anomaly detectors scored on precision/recall/F1 and point-adjusted F1"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Taimour Abdul Karim", email = "taimour.a.karim@gmail.com" }]
keywords = ["anomaly-detection", "time-series", "stl", "isolation-forest", "monitoring", "statistics"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "statsmodels>=0.14", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tsanomaly = "tsanomaly.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tsanomaly"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
